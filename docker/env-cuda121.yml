name: llm-dgl-cuda121
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - openmpi=4.1.4
  - python=3.10.21
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - pandas=2.2.3
  - ollama=0.30.10
  - ollama-python=0.6.2
  - ogb=1.3.6
  - xgboost=3.2.0
  - scikit-learn=1.7.2
  - numba=0.66.0
  - pip
  - pip:
    - --find-links https://download.pytorch.org/whl/torch/
    - pytorch-tabnet==4.1.0
    - cmake>=3.18,<4
    - cython<3
    - filelock
    - matplotlib
    - networkx
    - nltk
    - nose
    - numpy
    - ogb
    - pandas
    - psutil
    - pyarrow
    - pydantic>=2.0
    - pytest
    - pyyaml
    - rdflib
    - requests[security]
    - scikit-learn
    - scipy
    - torcheval
    - torchmetrics
    - torch_geometric
    - tqdm
    - boto3 # AWS SDK for python
    - sphinx
    - sphinx-gallery
    - sphinx_rtd_theme
    - sphinx_copybutton
    - sphinxemoji
    - nbsphinx
    - nbsphinx-link
    - pillow
    - seaborn
    - jupyter_http_over_ws
    - ufmt
    - clang-format
    - pylint
    - lintrunner
    - jupyterlab
    - ipywidgets
    - expecttest